<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Poker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* ═══════════════════════════════════════════════════════════
       PORTAL POKER — "The Dusty Saloon"
       Wild West poker room: aged wood, oil-lamp warmth,
       whiskey-amber glow, weathered leather, frontier grit.
       ═══════════════════════════════════════════════════════════ */

    :root {
      --poker-surface-0: #120904;
      --poker-surface-1: #1c0f07;
      --poker-surface-2: #28180c;
      --poker-surface-3: #362010;
      --poker-overlay: rgba(12, 6, 2, 0.85);
      --poker-text-primary: #ecdcc4;
      --poker-text-secondary: #b89e78;
      --poker-text-tertiary: #8a7558;
      --poker-text-inverse: #120904;
      --poker-accent-gold: #c87d1a;
      --poker-accent-gold-strong: #e09422;
      --poker-accent-gold-soft: rgba(200, 125, 26, 0.14);
      --poker-success: #7a9e5a;
      --poker-warning: #c8942a;
      --poker-danger: #a84032;
      --poker-info: #7a9bb0;
      --poker-line-subtle: rgba(200, 125, 26, 0.10);
      --poker-line-strong: rgba(200, 125, 26, 0.22);
      --poker-focus-ring: #e09422;
      --poker-font-display: "Rye", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", Georgia, serif;
      --poker-font-ui: "Crimson Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", Georgia, serif;
      --poker-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --poker-bg: var(--poker-surface-0);
      --poker-ink: var(--poker-text-primary);
      --poker-card: var(--poker-surface-1);
      --poker-accent: var(--poker-accent-gold);
      --poker-muted: var(--poker-text-secondary);
      --poker-line: var(--poker-line-subtle);
      --poker-radius-card: 6px;
      --poker-radius-inner: 4px;
      --poker-radius-pill: 3px;
      --poker-shadow-card:
        0 4px 24px rgba(0, 0, 0, 0.50),
        0 0 1px rgba(200, 125, 26, 0.10);
      --poker-shadow-elevated:
        0 12px 48px rgba(0, 0, 0, 0.60),
        0 0 1px rgba(200, 125, 26, 0.18);
      --poker-shadow-glow:
        0 0 50px rgba(200, 125, 26, 0.10),
        0 0 100px rgba(200, 125, 26, 0.04);
      --poker-ease: cubic-bezier(0.22, 0.68, 0, 1);
    }

    /* ── Base Shell — Saloon Interior ──────────────────── */
    body.pokerShell {
      margin: 0;
      min-height: 100vh;
      color: var(--poker-ink);
      font-family: var(--poker-font-ui);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-color: #0e0604;
      background-image:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(200, 125, 26, 0.10), transparent),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(168, 64, 50, 0.04), transparent),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(18, 9, 4, 0.9), transparent);
      background-attachment: fixed;
    }
    /* Wood-plank grain overlay */
    body.pokerShell::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 80px,
          rgba(200, 125, 26, 0.03) 80px,
          rgba(200, 125, 26, 0.03) 81px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.08) 3px,
          rgba(0, 0, 0, 0.08) 4px
        );
    }
    /* Oil-lamp glow at top */
    body.pokerShell::after {
      content: "";
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 300px;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(200, 125, 26, 0.08), transparent 70%);
      filter: blur(40px);
    }

    .pokerFrame {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    /* ── Hero / Title ──────────────────────────────────── */
    .pokerHero {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 2px solid rgba(200, 125, 26, 0.15);
      background-image: linear-gradient(90deg, rgba(200, 125, 26, 0.06), transparent 60%);
      margin-left: -24px;
      margin-right: -24px;
      padding-left: 24px;
      padding-right: 24px;
    }
    .pokerHero h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--poker-accent-gold-strong);
      font-family: var(--poker-font-display);
      font-weight: 400;
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(200, 125, 26, 0.2);
    }
    .pokerHero p {
      max-width: 42rem;
      margin: 8px 0 0;
      color: var(--poker-text-tertiary);
      line-height: 1.55;
      font-size: 15px;
      font-style: italic;
    }

    /* ── Status Bar ────────────────────────────────────── */
    .pokerStatus {
      min-height: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: var(--poker-radius-inner);
      border: 1px solid transparent;
      color: var(--poker-text-secondary);
      font-size: 14px;
      font-style: italic;
      line-height: 1.5;
      transition:
        background-color 200ms var(--poker-ease),
        border-color 200ms var(--poker-ease),
        color 200ms var(--poker-ease);
    }
    .pokerStatus:empty {
      min-height: 0;
      padding: 0;
      border-color: transparent;
      background: transparent;
    }
    .pokerStatus:not(:empty) {
      padding: 10px 16px;
      background: rgba(200, 125, 26, 0.04);
      border-color: rgba(200, 125, 26, 0.10);
    }
    .pokerStatus::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--poker-text-tertiary);
    }
    .pokerStatus[data-poker-status-kind="loading"] {
      border-color: rgba(200, 125, 26, 0.22);
      background: rgba(200, 125, 26, 0.06);
      color: var(--poker-accent-gold-strong);
    }
    .pokerStatus[data-poker-status-kind="loading"]::before {
      background: var(--poker-accent-gold);
      animation: pokerPulseGlow 1.4s ease-in-out infinite;
    }
    .pokerStatus[data-poker-status-kind="ready"] {
      border-color: rgba(122, 155, 176, 0.20);
      background: rgba(122, 155, 176, 0.06);
      color: var(--poker-info);
    }
    .pokerStatus[data-poker-status-kind="ready"]::before {
      background: var(--poker-info);
    }
    .pokerStatus[data-poker-status-kind="empty"] {
      border-color: rgba(138, 117, 88, 0.15);
      background: rgba(255, 255, 255, 0.01);
      color: var(--poker-text-tertiary);
    }
    .pokerStatus[data-poker-status-kind="empty"]::before {
      background: var(--poker-text-tertiary);
    }
    .pokerStatus[data-poker-status-kind="error"] {
      border-color: rgba(168, 64, 50, 0.30);
      background: rgba(168, 64, 50, 0.08);
      color: #e8a89c;
    }
    .pokerStatus[data-poker-status-kind="error"]::before {
      background: var(--poker-danger);
    }

    /* ── Grid ──────────────────────────────────────────── */
    .pokerGrid {
      display: grid;
      gap: 18px;
    }

    /* ── Cards (panels) — Weathered Leather ────────────── */
    .pokerCard {
      border-radius: var(--poker-radius-card);
      border: 1px solid rgba(200, 125, 26, 0.12);
      border-top-color: rgba(200, 125, 26, 0.18);
      background:
        linear-gradient(175deg, rgba(54, 32, 16, 0.50) 0%, rgba(28, 15, 7, 0.96) 100%);
      box-shadow: var(--poker-shadow-card);
      padding: 24px;
      animation: pokerCardIn 350ms var(--poker-ease) both;
      position: relative;
    }
    /* Leather stitch top border accent */
    .pokerCard::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: repeating-linear-gradient(
        90deg,
        rgba(200, 125, 26, 0.20),
        rgba(200, 125, 26, 0.20) 6px,
        transparent 6px,
        transparent 10px
      );
    }
    .pokerCard:nth-child(1) { animation-delay: 0ms; }
    .pokerCard:nth-child(2) { animation-delay: 50ms; }
    .pokerCard:nth-child(3) { animation-delay: 100ms; }
    .pokerCard:nth-child(4) { animation-delay: 150ms; }
    .pokerCard:nth-child(5) { animation-delay: 200ms; }
    .pokerCard:nth-child(6) { animation-delay: 250ms; }
    .pokerCard:nth-child(n+7) { animation-delay: 300ms; }
    .pokerCard[data-poker-plane="primary"] {
      border-color: rgba(200, 125, 26, 0.28);
      background:
        linear-gradient(175deg, rgba(200, 125, 26, 0.12) 0%, rgba(28, 15, 7, 0.97) 100%);
      box-shadow: var(--poker-shadow-elevated), var(--poker-shadow-glow);
    }
    .pokerCard[data-poker-plane="reference"] {
      border-color: rgba(200, 125, 26, 0.06);
      background:
        linear-gradient(175deg, rgba(40, 24, 12, 0.55) 0%, rgba(28, 15, 7, 0.90) 100%);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.30);
    }
    .pokerCard[data-poker-state="loading"] {
      border-color: rgba(200, 125, 26, 0.20);
      background: linear-gradient(175deg, rgba(200, 125, 26, 0.08) 0%, rgba(28, 15, 7, 0.95) 100%);
    }
    .pokerCard[data-poker-state="empty"] {
      border-color: rgba(138, 117, 88, 0.12);
      background: linear-gradient(175deg, rgba(40, 24, 12, 0.40) 0%, rgba(28, 15, 7, 0.88) 100%);
    }
    .pokerCard[data-poker-state="error"] {
      border-color: rgba(168, 64, 50, 0.30);
      background: linear-gradient(175deg, rgba(168, 64, 50, 0.08) 0%, rgba(28, 15, 7, 0.95) 100%);
    }
    .pokerCard h2,
    .pokerCard h3 {
      margin: 0 0 10px;
      color: var(--poker-text-primary);
      line-height: 1.2;
      text-transform: none;
      font-family: var(--poker-font-display);
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .pokerCard h2 {
      font-size: 21px;
    }
    .pokerCard h3 {
      font-size: 18px;
    }
    .pokerCard p {
      margin: 0;
      color: var(--poker-text-secondary);
      line-height: 1.65;
    }

    /* ── Meta Badges — Wanted Poster Tags ──────────────── */
    .pokerMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0;
    }
    .pokerBadge {
      border-radius: var(--poker-radius-pill);
      border: 1px solid rgba(200, 125, 26, 0.25);
      color: var(--poker-accent);
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(200, 125, 26, 0.06);
    }

    /* ── Buttons & Links — Wooden Signs ────────────────── */
    .pokerLinks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .pokerLinks a,
    .pokerButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      max-width: 100%;
      border-radius: var(--poker-radius-pill);
      border: 1px solid rgba(200, 125, 26, 0.22);
      color: var(--poker-text-primary);
      text-decoration: none;
      padding: 10px 22px;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
      font-weight: 600;
      font-size: 14px;
      background: rgba(200, 125, 26, 0.06);
      transition:
        background-color 150ms var(--poker-ease),
        border-color 150ms var(--poker-ease),
        color 150ms var(--poker-ease),
        transform 80ms var(--poker-ease),
        box-shadow 150ms var(--poker-ease);
    }
    .pokerButton {
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
    }
    .pokerButtonPrimary,
    .pokerLinks a.pokerButtonPrimary,
    .pokerButton[data-action-role="primary"] {
      background:
        linear-gradient(180deg, #d4901a 0%, #b06e10 100%);
      border-color: rgba(200, 125, 26, 0.60);
      color: #fff8ee;
      font-weight: 700;
      box-shadow:
        0 4px 16px rgba(200, 125, 26, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.03em;
    }
    .pokerButtonSecondary,
    .pokerButton[data-action-role="secondary"] {
      background: rgba(236, 220, 196, 0.06);
      border-color: rgba(236, 220, 196, 0.16);
      color: var(--poker-text-primary);
    }
    .pokerButtonNav,
    .pokerLinks a,
    .pokerLinks a[data-action-role="navigation"],
    .pokerLinks a.pokerButtonNav {
      background: rgba(200, 125, 26, 0.04);
      border-color: rgba(200, 125, 26, 0.14);
      color: var(--poker-text-secondary);
      font-weight: 400;
      font-style: italic;
    }
    .pokerButtonDanger,
    .pokerButton[data-action-role="destructive"] {
      background: rgba(168, 64, 50, 0.12);
      border-color: rgba(168, 64, 50, 0.40);
      color: #e8a89c;
    }
    .pokerLinks a:hover,
    .pokerButton:hover:not(:disabled) {
      border-color: rgba(200, 125, 26, 0.45);
      background: rgba(200, 125, 26, 0.14);
      color: var(--poker-text-primary);
      box-shadow: 0 0 16px rgba(200, 125, 26, 0.10);
    }
    .pokerButtonPrimary:hover:not(:disabled),
    .pokerLinks a.pokerButtonPrimary:hover {
      background: linear-gradient(180deg, #e09a20 0%, #c07c14 100%);
      color: #fff8ee;
      transform: translateY(-1px);
      box-shadow:
        0 8px 24px rgba(200, 125, 26, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .pokerButtonDanger:hover:not(:disabled) {
      background: rgba(168, 64, 50, 0.18);
      border-color: rgba(168, 64, 50, 0.50);
      color: #f0beb4;
    }
    .pokerLinks a:focus-visible,
    .pokerButton:focus-visible,
    .pokerForm input:focus-visible,
    .pokerForm textarea:focus-visible,
    .pokerForm select:focus-visible {
      outline: 2px solid var(--poker-focus-ring);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(224, 148, 34, 0.15);
    }
    .pokerButton:active:not(:disabled) {
      transform: translateY(1px);
    }
    .pokerButton:disabled,
    .pokerLinks a[aria-disabled="true"] {
      opacity: 0.40;
      cursor: not-allowed;
      border-color: rgba(138, 117, 88, 0.12);
      color: var(--poker-text-tertiary);
      background: rgba(255, 255, 255, 0.02);
      box-shadow: none;
      filter: saturate(0.5) brightness(0.8);
    }

    /* ── State Shells ──────────────────────────────────── */
    .pokerStateShell {
      display: grid;
      gap: 12px;
    }
    .pokerStateEyebrow {
      color: var(--poker-text-tertiary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pokerStateDetail {
      color: var(--poker-text-secondary);
    }
    .pokerSupportMeta {
      color: var(--poker-text-tertiary);
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
    }
    .pokerVoiceReadySlot[hidden],
    .pokerSupportMeta[hidden] {
      display: none !important;
    }
    .pokerAgentContext[hidden] {
      display: none !important;
    }
    .pokerCard[data-poker-state="loading"] .pokerStateShell {
      animation: pokerStatePulse 1.8s ease-in-out infinite;
    }

    /* ── Tables ────────────────────────────────────────── */
    .pokerTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .pokerTable th,
    .pokerTable td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--poker-line);
      text-align: left;
    }
    .pokerTable th {
      color: var(--poker-text-tertiary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    /* ── Forms ─────────────────────────────────────────── */
    .pokerForm {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .pokerForm label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--poker-text-secondary);
    }
    .pokerForm input,
    .pokerForm textarea,
    .pokerForm select {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      border-radius: var(--poker-radius-inner);
      border: 1px solid rgba(200, 125, 26, 0.15);
      background: rgba(18, 9, 4, 0.65);
      color: var(--poker-ink);
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      transition: border-color 150ms var(--poker-ease), background 150ms var(--poker-ease);
    }
    .pokerForm input:hover,
    .pokerForm textarea:hover,
    .pokerForm select:hover {
      border-color: rgba(200, 125, 26, 0.28);
      background: rgba(18, 9, 4, 0.80);
    }
    .pokerForm textarea {
      min-height: 96px;
      resize: vertical;
    }

    /* ── Metrics ───────────────────────────────────────── */
    .pokerMetric {
      padding: 14px 16px;
      border-radius: var(--poker-radius-inner);
      border: 1px solid rgba(200, 125, 26, 0.10);
      background: rgba(200, 125, 26, 0.03);
    }
    .pokerLabel {
      margin-bottom: 6px;
      color: var(--poker-text-tertiary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .pokerStack {
      display: grid;
      gap: 10px;
    }

    /* ── Quick Seat ────────────────────────────────────── */
    .pokerQuickSeatForm {
      gap: 14px;
    }
    .pokerQuickSeatPrimaryRow {
      display: grid;
      gap: 12px;
      align-items: end;
      margin-top: 4px;
    }
    .pokerQuickSeatField {
      margin: 0;
    }
    .pokerQuickSeatField select {
      font-weight: 700;
      font-size: 16px;
    }
    .pokerQuickSeatPrimaryRow .pokerButton {
      width: 100%;
    }
    .pokerQuickSeatSummaryLine {
      margin: 0;
      color: var(--poker-text-secondary);
      font-size: 15px;
      line-height: 1.5;
    }
    .pokerQuickSeatDestinations {
      margin-top: 0;
    }
    .pokerQuickSeatAdvancedFields {
      display: grid;
      gap: 12px;
    }
    .pokerQuickSeatAdvancedFieldsFull {
      grid-column: 1 / -1;
    }

    /* ── Compact Lists ─────────────────────────────────── */
    .pokerCompactList {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }
    .pokerCompactEntry {
      display: grid;
      gap: 10px;
      padding: 16px 0 0;
      border-top: 1px solid rgba(200, 125, 26, 0.10);
    }
    .pokerCompactEntry:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .pokerCompactEntryPrimary {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: flex-start;
    }
    .pokerCompactEntryPrimary > div:first-child {
      min-width: 0;
      flex: 1 1 260px;
    }
    .pokerCompactEntry h3 {
      margin: 0;
      color: var(--poker-text-primary);
      line-height: 1.2;
      font-size: 19px;
      font-family: var(--poker-font-display);
      font-weight: 400;
    }
    .pokerCompactEntrySummary {
      margin: 8px 0 0;
      color: var(--poker-text-secondary);
      line-height: 1.5;
    }
    .pokerCompactEntryAction {
      margin-top: 0;
      flex: 0 0 auto;
    }
    .pokerCompactFacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pokerCompactFactItem {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: var(--poker-radius-pill);
      border: 1px solid rgba(200, 125, 26, 0.14);
      background: rgba(200, 125, 26, 0.04);
      color: var(--poker-text-secondary);
      font-size: 14px;
      line-height: 1.35;
    }

    /* ── Rows / Splits / Summary ───────────────────────── */
    .pokerRow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(200, 125, 26, 0.08);
    }
    .pokerSplit {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }
    .pokerSummary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }
    .pokerFactStrip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .pokerFact {
      display: grid;
      gap: 4px;
      min-width: 115px;
      flex: 1 1 115px;
      padding: 12px 14px;
      border-radius: var(--poker-radius-inner);
      border: 1px solid rgba(200, 125, 26, 0.10);
      background: rgba(200, 125, 26, 0.03);
    }
    .pokerFactLabel {
      color: var(--poker-text-tertiary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pokerFactValue {
      color: var(--poker-text-primary);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .pokerSummaryValue {
      font-size: 24px;
      font-weight: 400;
      color: var(--poker-accent-gold-strong);
      line-height: 1.15;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-family: var(--poker-font-display);
      text-shadow: 0 0 12px rgba(200, 125, 26, 0.2);
    }

    /* ── Advanced Panels ───────────────────────────────── */
    .pokerAdvancedPanel {
      margin-top: 16px;
      border-top: 1px solid rgba(200, 125, 26, 0.10);
      padding-top: 14px;
    }
    .pokerAdvancedPanel summary {
      display: grid;
      gap: 4px;
      cursor: pointer;
      list-style: none;
      color: var(--poker-text-primary);
    }
    .pokerAdvancedPanel summary::-webkit-details-marker {
      display: none;
    }
    .pokerAdvancedPanel summary::after {
      content: "⊞ Show details";
      color: var(--poker-text-tertiary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 150ms var(--poker-ease);
    }
    .pokerAdvancedPanel summary:hover::after {
      color: var(--poker-accent);
    }
    .pokerAdvancedPanel[open] summary::after {
      content: "⊟ Hide details";
    }
    .pokerAdvancedKicker {
      color: var(--poker-text-tertiary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .pokerAdvancedTitle {
      color: var(--poker-text-primary);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }
    .pokerAdvancedSummary {
      color: var(--poker-text-secondary);
      font-size: 14px;
      line-height: 1.5;
      font-style: italic;
    }
    .pokerAdvancedBody {
      display: grid;
      gap: 14px;
      padding-top: 14px;
    }

    /* ── Playing Cards — Saloon Deck ───────────────────── */
    .pokerCardStrip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pokerMiniCard {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 66px;
      padding: 4px 6px;
      border-radius: 5px;
      border: 1.5px solid rgba(180, 160, 130, 0.50);
      background:
        linear-gradient(175deg, #f5ecd8 0%, #e2d4b8 50%, #d8c8a6 100%);
      color: #2a1a0a;
      font-weight: 700;
      font-size: 17px;
      font-family: var(--poker-font-ui);
      line-height: 1;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      position: relative;
      text-shadow: none;
    }
    .pokerMiniCard[data-suit="h"],
    .pokerMiniCard[data-suit="d"] {
      color: #8b1a1a;
    }
    .pokerMiniCard[data-suit="s"],
    .pokerMiniCard[data-suit="c"] {
      color: #1a1208;
    }
    .pokerMiniCard[data-card-hidden="true"] {
      background:
        repeating-linear-gradient(
          45deg,
          #3a2010,
          #3a2010 4px,
          #4a2c16 4px,
          #4a2c16 8px
        );
      border-color: rgba(200, 125, 26, 0.35);
      color: var(--poker-accent-gold-strong);
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(200, 125, 26, 0.12);
    }

    /* ── Countdown ─────────────────────────────────────── */
    .pokerCountdown {
      font-size: 38px;
      font-weight: 400;
      color: var(--poker-accent-gold-strong);
      letter-spacing: 0.04em;
      font-family: var(--poker-font-display);
      text-shadow:
        0 0 20px rgba(200, 125, 26, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* ── Messages & Chat ───────────────────────────────── */
    .pokerMessage {
      padding: 14px 16px;
      border-radius: var(--poker-radius-inner);
      border: 1px solid rgba(200, 125, 26, 0.10);
      background: rgba(200, 125, 26, 0.03);
    }
    .pokerMessage.is-agent {
      border-color: rgba(200, 125, 26, 0.25);
      background: rgba(200, 125, 26, 0.06);
      border-left: 3px solid var(--poker-accent-gold);
    }
    .pokerRailEntry {
      background: rgba(255, 255, 255, 0.01);
    }
    .pokerActionCluster {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(200, 125, 26, 0.10);
    }
    .pokerActionCluster[data-admin-action-group="destructive"] {
      border-top-color: rgba(168, 64, 50, 0.28);
    }
    .pokerChipRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .pokerChip {
      border-radius: var(--poker-radius-pill);
      border: 1.5px solid rgba(200, 125, 26, 0.30);
      background: rgba(200, 125, 26, 0.08);
      padding: 6px 14px;
      font-weight: 600;
      font-size: 14px;
    }
    .pokerChatLog {
      display: grid;
      gap: 8px;
    }
    .pokerChatLine {
      display: grid;
      gap: 6px;
      border-radius: var(--poker-radius-inner);
      border: 1px solid rgba(200, 125, 26, 0.10);
      background: rgba(200, 125, 26, 0.03);
      padding: 12px 14px;
    }
    .pokerList {
      margin: 12px 0 0;
      padding-left: 18px;
      color: var(--poker-muted);
      line-height: 1.6;
    }
    .pokerMuted {
      color: var(--poker-muted);
    }
    .pokerEmpty {
      color: var(--poker-muted);
      padding: 8px 0;
    }

    /* ═══════════════════════════════════════════════════════
       VIEW-SPECIFIC OVERRIDES
       ═══════════════════════════════════════════════════════ */

    /* ── Play Table ────────────────────────────────────── */
    .pokerGrid[data-poker-view="play-table"] {
      gap: 16px;
    }
    .pokerGrid[data-poker-view="play-lobby"] > [data-poker-section="quick-seat"],
    .pokerGrid[data-poker-view="play-lobby"] > [data-poker-section="live-tables"],
    .pokerGrid[data-poker-view="play-schedule"] > [data-poker-section="schedule-day"],
    .pokerGrid[data-poker-view="play-schedule"] > [data-poker-section="schedule-snapshot"] {
      border-color: rgba(200, 125, 26, 0.20);
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"],
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] {
      border-color: rgba(200, 125, 26, 0.35);
      background:
        linear-gradient(175deg, rgba(200, 125, 26, 0.12) 0%, rgba(28, 15, 7, 0.97) 100%);
      box-shadow: var(--poker-shadow-elevated), var(--poker-shadow-glow);
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] {
      border-color: rgba(200, 125, 26, 0.45);
      box-shadow:
        var(--poker-shadow-elevated),
        0 0 50px rgba(200, 125, 26, 0.12),
        0 0 100px rgba(200, 125, 26, 0.05),
        inset 0 1px 0 rgba(200, 125, 26, 0.12);
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerForm,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="your-seat"] .pokerForm {
      margin-top: 16px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerForm {
      gap: 10px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerButton {
      width: 100%;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSplit {
      align-items: flex-start;
      gap: 16px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSplit > * {
      flex: 1 1 140px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="table-summary"] .pokerSummary,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="your-seat"] .pokerSummary,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSummary {
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="seat-thread"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="study-preview"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="table-review"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="operator-review"] .pokerStack {
      gap: 12px;
    }

    /* ── Hand Review ───────────────────────────────────── */
    .pokerGrid[data-poker-view="play-hand-review"] {
      gap: 16px;
    }
    .pokerGrid[data-poker-view="play-hand-review"] > [data-poker-section="review-summary-shell"] .pokerLinks {
      margin-top: 18px;
    }
    .pokerGrid[data-poker-view="play-hand-review"] > :is(
      [data-poker-section="review-result-summary"],
      [data-poker-section="review-action-line"],
      [data-poker-section="review-board-pot"]
    ) {
      border-color: rgba(200, 125, 26, 0.25);
    }
    .pokerGrid[data-poker-view="play-hand-review"] > :is(
      [data-poker-section="review-human-note"],
      [data-poker-section="review-agent-note"],
      [data-poker-section="review-lesson-tags"],
      [data-poker-section="review-notebook"],
      [data-poker-section="review-opponent-notes"]
    ) .pokerStack {
      gap: 12px;
    }

    /* ── Native Season ─────────────────────────────────── */
    .pokerGrid[data-poker-view="play-native-season"] {
      gap: 16px;
    }
    .pokerGrid[data-poker-view="play-native-season"] > [data-poker-section="season-leaderboard"] {
      border-color: rgba(200, 125, 26, 0.28);
      background:
        linear-gradient(175deg, rgba(200, 125, 26, 0.10) 0%, rgba(28, 15, 7, 0.96) 100%);
    }

    /* ── Rail ──────────────────────────────────────────── */
    .pokerGrid[data-poker-view="play-rail-lobby"],
    .pokerGrid[data-poker-view="play-rail-series"] {
      gap: 16px;
    }
    .pokerGrid:is([data-poker-view="play-rail-lobby"], [data-poker-view="play-rail-series"]) .pokerCard {
      background: linear-gradient(175deg, rgba(40, 24, 12, 0.50) 0%, rgba(28, 15, 7, 0.88) 100%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
    }
    .pokerGrid:is([data-poker-view="play-rail-lobby"], [data-poker-view="play-rail-series"]) .pokerSummaryValue {
      font-size: 22px;
    }
    .pokerGrid:is([data-poker-view="play-rail-lobby"], [data-poker-view="play-rail-series"]) .pokerLinks {
      margin-top: 16px;
    }

    /* ── Centaur ───────────────────────────────────────── */
    .pokerGrid[data-poker-view="centaur-table"] {
      gap: 16px;
    }
    .pokerGrid[data-poker-view="centaur-table"] > :is(
      [data-poker-section="centaur-live-hand"],
      [data-poker-section="centaur-submit-action"]
    ) {
      border-color: rgba(200, 125, 26, 0.35);
      background: linear-gradient(175deg, rgba(200, 125, 26, 0.12) 0%, rgba(28, 15, 7, 0.97) 100%);
      box-shadow: var(--poker-shadow-elevated), var(--poker-shadow-glow);
    }
    .pokerGrid[data-poker-view="centaur-table"] > [data-poker-section="centaur-discussion"] .pokerStack {
      gap: 12px;
    }

    /* ── Locale Overrides ──────────────────────────────── */
    [data-poker-locale="zh-Hans"] .pokerHero h1,
    [data-poker-locale="zh-Hans"] .pokerBadge,
    [data-poker-locale="zh-Hans"] .pokerTable th {
      letter-spacing: 0;
    }
    [data-poker-locale="zh-Hans"] .pokerBadge,
    [data-poker-locale="zh-Hans"] .pokerTable th {
      text-transform: none;
    }
    [data-poker-locale="zh-Hans"] .pokerHero h1 {
      text-transform: none;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="operator-review"] .pokerLinks {
      margin-top: 0;
    }

    /* ═══════════════════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════════════════ */
    @keyframes pokerCardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pokerStatePulse {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes pokerPulseGlow {
      0%, 100% {
        box-shadow: 0 0 4px currentColor;
        opacity: 1;
      }
      50% {
        box-shadow: 0 0 10px currentColor;
        opacity: 0.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pokerLinks a,
      .pokerButton,
      .pokerStatus,
      .pokerCard,
      .pokerStateShell {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════ */
    @media (min-width: 900px) {
      .pokerFrame {
        padding-left: 28px;
        padding-right: 28px;
      }
      .pokerGrid[data-poker-view="play-table"],
      .pokerGrid[data-poker-view="play-hand-review"],
      .pokerGrid[data-poker-view="centaur-table"] {
        gap: 24px;
      }
    }
    @media (min-width: 760px) {
      .pokerQuickSeatPrimaryRow {
        grid-template-columns: minmax(200px, 240px) minmax(0, 1fr);
      }
      .pokerQuickSeatAdvancedFields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .pokerGrid[data-poker-view="play-hand-review"] {
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-hand-review"] > [data-poker-section="review-summary-shell"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="play-hand-review"] > :is(
        [data-poker-section="review-result-summary"],
        [data-poker-section="review-action-line"],
        [data-poker-section="review-board-pot"]
      ) {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="play-hand-review"] > :is(
        [data-poker-section="review-human-note"],
        [data-poker-section="review-agent-note"],
        [data-poker-section="review-lesson-tags"],
        [data-poker-section="review-notebook"],
        [data-poker-section="review-opponent-notes"]
      ) {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="play-native-season"] {
        grid-template-columns: minmax(0, 1.14fr) minmax(300px, 0.86fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-native-season"] > [data-poker-section="season-summary"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="play-native-season"] > [data-poker-section="season-leaderboard"] {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="play-native-season"] > [data-poker-section="season-economy"] {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="play-rail-lobby"] {
        grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-rail-lobby"] > [data-poker-section="rail-lobby-summary"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="play-rail-lobby"] > [data-poker-section="rail-lobby-series"] {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="play-rail-lobby"] > [data-poker-section="rail-lobby-tables"] {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="play-rail-series"] {
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-rail-series"] > [data-poker-section="rail-series-summary"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="play-rail-series"] > [data-poker-section="rail-series-tables"] {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="play-rail-series"] > [data-poker-section="rail-series-payouts"] {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="centaur-table"] {
        grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="centaur-table"] > [data-poker-section="centaur-summary"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="centaur-table"] > :is(
        [data-poker-section="centaur-live-hand"],
        [data-poker-section="centaur-submit-action"],
        [data-poker-section="centaur-verify"],
        [data-poker-section="centaur-join"]
      ) {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="centaur-table"] > :is(
        [data-poker-section="centaur-discussion"],
        [data-poker-section="centaur-snapshot-hour"]
      ) {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="play-table"]:not([data-poker-live-state="rail"]) {
        grid-template-columns: minmax(0, 1.14fr) minmax(300px, 0.86fr);
        gap: 20px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-table"]:not([data-poker-live-state="rail"]) > :is(
        [data-poker-section="current-hand"],
        [data-poker-section="submit-action"],
        [data-poker-section="take-seat"],
        [data-poker-section="waitlist"],
        [data-poker-section="public-action-log"]
      ) {
        grid-column: 1;
      }
      .pokerGrid[data-poker-view="play-table"]:not([data-poker-live-state="rail"]) > :is(
        [data-poker-section="table-summary"],
        [data-poker-section="invite-access"],
        [data-poker-section="your-seat"],
        [data-poker-section="seat-agent-suggestion"],
        [data-poker-section="worker-seat-agent"],
        [data-poker-section="seat-thread"],
        [data-poker-section="auto-act"],
        [data-poker-section="flag-review"],
        [data-poker-section="table-review"],
        [data-poker-section="study-preview"],
        [data-poker-section="series-director"],
        [data-poker-section="seats"]
      ) {
        grid-column: 2;
      }
      .pokerGrid[data-poker-view="play-table"]:not([data-poker-live-state="rail"]) > [data-poker-section="operator-review"] {
        grid-column: 1 / -1;
      }
      .pokerGrid[data-poker-view="play-table"][data-poker-live-state="rail"] {
        grid-template-columns: minmax(0, 1.08fr) minmax(280px, 0.92fr);
        gap: 18px;
        align-items: start;
      }
      .pokerGrid[data-poker-view="play-table"][data-poker-live-state="rail"] > :is(

      }

        [data-poker-section="seats"]

        grid-column: 2;
      }
    }
    @media (min-width: 1200px) {
      .pokerFrame {
        max-width: 1240px;
        padding-left: 36px;
        padding-right: 36px;
      }
      .pokerGrid[data-poker-view="play-table"]:not([data-poker-live-state="rail"]) {
        grid-template-columns: minmax(0, 1.32fr) minmax(340px, 0.88fr);
        gap: 24px;
      }
      .pokerGrid[data-poker-view="play-hand-review"] {
        grid-template-columns: minmax(0, 1.24fr) minmax(340px, 0.84fr);
      }
      .pokerGrid[data-poker-view="play-native-season"] {
        grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
      }
      .pokerGrid[data-poker-view="play-rail-series"] {
        grid-template-columns: minmax(0, 1.12fr) minmax(360px, 0.88fr);
      }
      .pokerGrid[data-poker-view="centaur-table"] {
        grid-template-columns: minmax(0, 1.16fr) minmax(340px, 0.84fr);
