<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Poker</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --poker-surface-0: #0b1014;
      --poker-surface-1: #11181d;
      --poker-surface-2: #182126;
      --poker-surface-3: #202b31;
      --poker-overlay: rgba(8, 12, 16, 0.72);
      --poker-text-primary: #f4ecdc;
      --poker-text-secondary: #b8ae99;
      --poker-text-tertiary: #8e8678;
      --poker-text-inverse: #081014;
      --poker-accent-gold: #d6aa63;
      --poker-accent-gold-strong: #e4bd79;
      --poker-accent-gold-soft: rgba(214, 170, 99, 0.14);
      --poker-success: #90b88f;
      --poker-warning: #d1aa5c;
      --poker-danger: #c98778;
      --poker-info: #81a7be;
      --poker-line-subtle: #26313a;
      --poker-line-strong: #31404a;
      --poker-focus-ring: #f0d49c;
      --poker-font-display: "Wellfleet", "Iowan Old Style", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", Georgia, serif;
      --poker-font-ui: "Iowan Old Style", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", "Palatino Linotype", Georgia, serif;
      --poker-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --poker-bg: var(--poker-surface-0);
      --poker-ink: var(--poker-text-primary);
      --poker-card: var(--poker-surface-1);
      --poker-accent: var(--poker-accent-gold);
      --poker-muted: var(--poker-text-secondary);
      --poker-line: var(--poker-line-subtle);
    }
    body.pokerShell {
      margin: 0;
      min-height: 100vh;
      color: var(--poker-ink);
      font-family: var(--poker-font-ui);
      background:
        radial-gradient(circle at top, rgba(214, 170, 99, 0.16), transparent 36%),
        linear-gradient(180deg, #12191d 0%, var(--poker-bg) 100%);
    }
    .pokerFrame {
      max-width: 1160px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .pokerHero {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 24px;
    }
    .pokerHero h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: 0.01em;
      text-transform: none;
      color: var(--poker-text-primary);
      font-family: var(--poker-font-display);
    }
    .pokerHero p {
      max-width: 42rem;
      margin: 8px 0 0;
      color: var(--poker-muted);
      line-height: 1.5;
    }
    .pokerStatus {
      min-height: 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      color: var(--poker-text-secondary);
      font-size: 14px;
      line-height: 1.5;
      transition:
        background-color 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        color 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .pokerStatus:empty {
      min-height: 24px;
      padding: 0;
      border-color: transparent;
      background: transparent;
    }
    .pokerStatus:not(:empty) {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
    }
    .pokerStatus::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      margin-top: 6px;
      border-radius: 999px;
      background: var(--poker-line-strong);
    }
    .pokerStatus[data-poker-status-kind="loading"] {
      border-color: rgba(228, 189, 121, 0.24);
      background: rgba(228, 189, 121, 0.08);
      color: var(--poker-text-primary);
    }
    .pokerStatus[data-poker-status-kind="loading"]::before {
      background: var(--poker-accent-gold);
    }
    .pokerStatus[data-poker-status-kind="ready"] {
      border-color: rgba(129, 167, 190, 0.22);
      background: rgba(129, 167, 190, 0.08);
    }
    .pokerStatus[data-poker-status-kind="ready"]::before {
      background: var(--poker-info);
    }
    .pokerStatus[data-poker-status-kind="empty"] {
      border-color: rgba(184, 174, 153, 0.18);
      background: rgba(255, 255, 255, 0.02);
    }
    .pokerStatus[data-poker-status-kind="empty"]::before {
      background: var(--poker-text-tertiary);
    }
    .pokerStatus[data-poker-status-kind="error"] {
      border-color: rgba(201, 135, 120, 0.3);
      background: rgba(201, 135, 120, 0.1);
      color: #f5d7d0;
    }
    .pokerStatus[data-poker-status-kind="error"]::before {
      background: var(--poker-danger);
    }
    .pokerGrid {
      display: grid;
      gap: 24px;
    }
    .pokerCard {
      border-radius: 16px;
      border: 1px solid var(--poker-line);
      background: linear-gradient(180deg, rgba(32, 43, 49, 0.24) 0%, rgba(17, 24, 29, 0.96) 100%);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
      padding: 24px;
      backdrop-filter: blur(6px);
    }
    .pokerCard[data-poker-plane="primary"] {
      border-color: var(--poker-line-strong);
      background: linear-gradient(180deg, rgba(228, 189, 121, 0.08) 0%, rgba(17, 24, 29, 0.98) 100%);
    }
    .pokerCard[data-poker-plane="reference"] {
      background: linear-gradient(180deg, rgba(24, 33, 38, 0.82) 0%, rgba(17, 24, 29, 0.92) 100%);
    }
    .pokerCard[data-poker-state="loading"] {
      border-color: rgba(228, 189, 121, 0.24);
      background: linear-gradient(180deg, rgba(228, 189, 121, 0.1) 0%, rgba(17, 24, 29, 0.96) 100%);
    }
    .pokerCard[data-poker-state="empty"] {
      border-color: rgba(184, 174, 153, 0.18);
      background: linear-gradient(180deg, rgba(24, 33, 38, 0.68) 0%, rgba(17, 24, 29, 0.92) 100%);
    }
    .pokerCard[data-poker-state="error"] {
      border-color: rgba(201, 135, 120, 0.32);
      background: linear-gradient(180deg, rgba(201, 135, 120, 0.1) 0%, rgba(17, 24, 29, 0.96) 100%);
    }
    .pokerCard h2,
    .pokerCard h3 {
      margin: 0 0 10px;
      color: var(--poker-text-primary);
      line-height: 1.2;
      text-transform: none;
    }
    .pokerCard p {
      margin: 0;
      color: var(--poker-text-secondary);
      line-height: 1.6;
    }
    .pokerMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0 0;
    }
    .pokerBadge {
      border-radius: 999px;
      border: 1px solid rgba(214, 170, 99, 0.28);
      color: var(--poker-accent);
      padding: 5px 10px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pokerLinks {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
    }
    .pokerLinks a,
    .pokerButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      max-width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(244, 236, 220, 0.16);
      color: var(--poker-ink);
      text-decoration: none;
      padding: 10px 16px;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
      background: rgba(244, 236, 220, 0.04);
      transition:
        background-color 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        color 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .pokerButton {
      cursor: pointer;
      font: inherit;
    }
    .pokerButtonPrimary,
    .pokerLinks a.pokerButtonPrimary,
    .pokerButton[data-action-role="primary"] {
      background: var(--poker-accent-gold);
      border-color: rgba(228, 189, 121, 0.72);
      color: var(--poker-text-inverse);
      box-shadow: 0 10px 24px rgba(214, 170, 99, 0.18);
    }
    .pokerButtonSecondary,
    .pokerButton[data-action-role="secondary"] {
      background: rgba(244, 236, 220, 0.06);
      border-color: rgba(244, 236, 220, 0.16);
      color: var(--poker-text-primary);
    }
    .pokerButtonNav,
    .pokerLinks a,
    .pokerLinks a[data-action-role="navigation"],
    .pokerLinks a.pokerButtonNav {
      background: transparent;
      border-color: rgba(184, 174, 153, 0.24);
      color: var(--poker-text-secondary);
    }
    .pokerButtonDanger,
    .pokerButton[data-action-role="destructive"] {
      background: rgba(201, 135, 120, 0.12);
      border-color: rgba(201, 135, 120, 0.42);
      color: #f5d7d0;
    }
    .pokerLinks a:hover,
    .pokerButton:hover:not(:disabled) {
      border-color: rgba(228, 189, 121, 0.5);
      background: rgba(228, 189, 121, 0.12);
      color: var(--poker-text-primary);
    }
    .pokerButtonPrimary:hover:not(:disabled),
    .pokerLinks a.pokerButtonPrimary:hover {
      background: var(--poker-accent-gold-strong);
      color: var(--poker-text-inverse);
      transform: translateY(-1px);
    }
    .pokerButtonDanger:hover:not(:disabled) {
      background: rgba(201, 135, 120, 0.18);
      border-color: rgba(201, 135, 120, 0.52);
      color: #fff0ec;
    }
    .pokerLinks a:focus-visible,
    .pokerButton:focus-visible,
    .pokerForm input:focus-visible,
    .pokerForm textarea:focus-visible,
    .pokerForm select:focus-visible {
      outline: 2px solid var(--poker-focus-ring);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(240, 212, 156, 0.18);
    }
    .pokerButton:active:not(:disabled) {
      transform: translateY(1px);
    }
    .pokerButton:disabled,
    .pokerLinks a[aria-disabled="true"] {
      opacity: 0.52;
      cursor: not-allowed;
      border-color: rgba(142, 134, 120, 0.2);
      color: var(--poker-text-tertiary);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: none;
      filter: saturate(0.75);
    }
    .pokerStateShell {
      display: grid;
      gap: 12px;
    }
    .pokerStateEyebrow {
      color: var(--poker-text-tertiary);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pokerStateDetail {
      color: var(--poker-text-secondary);
    }
    .pokerSupportMeta {
      color: var(--poker-text-tertiary);
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }
    .pokerVoiceReadySlot[hidden],
    .pokerSupportMeta[hidden] {
      display: none !important;
    }
    .pokerCard[data-poker-state="loading"] .pokerStateShell {
      animation: pokerStatePulse 1.8s ease-in-out infinite;
    }
    .pokerTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .pokerTable th,
    .pokerTable td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--poker-line);
      text-align: left;
    }
    .pokerTable th {
      color: var(--poker-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pokerForm {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .pokerForm label {
      display: grid;
      gap: 6px;
    }
    .pokerForm input,
    .pokerForm textarea,
    .pokerForm select {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid var(--poker-line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--poker-ink);
      padding: 12px 14px;
      font: inherit;
    }
    .pokerForm textarea {
      min-height: 96px;
      resize: vertical;
    }
    .pokerMetric {
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--poker-line);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .pokerLabel {
      margin-bottom: 8px;
      color: var(--poker-text-secondary);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pokerStack {
      display: grid;
      gap: 10px;
    }
    .pokerRow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--poker-line);
    }
    .pokerSplit {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }
    .pokerSummary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .pokerFactStrip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .pokerFact {
      display: grid;
      gap: 4px;
      min-width: 132px;
      flex: 1 1 132px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(244, 236, 220, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }
    .pokerFactLabel {
      color: var(--poker-text-tertiary);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pokerFactValue {
      color: var(--poker-text-primary);
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .pokerSummaryValue {
      font-size: 28px;
      color: var(--poker-accent);
      line-height: 1.15;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .pokerAdvancedPanel {
      margin-top: 16px;
      border-top: 1px solid rgba(244, 236, 220, 0.08);
      padding-top: 14px;
    }
    .pokerAdvancedPanel summary {
      display: grid;
      gap: 4px;
      cursor: pointer;
      list-style: none;
      color: var(--poker-text-primary);
    }
    .pokerAdvancedPanel summary::-webkit-details-marker {
      display: none;
    }
    .pokerAdvancedPanel summary::after {
      content: "Show details";
      color: var(--poker-text-secondary);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pokerAdvancedPanel[open] summary::after {
      content: "Hide details";
    }
    .pokerAdvancedKicker {
      color: var(--poker-text-tertiary);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pokerAdvancedTitle {
      color: var(--poker-text-primary);
      font-size: 16px;
      line-height: 1.3;
    }
    .pokerAdvancedSummary {
      color: var(--poker-text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }
    .pokerAdvancedBody {
      display: grid;
      gap: 14px;
      padding-top: 14px;
    }
    .pokerCardStrip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pokerMiniCard {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      min-height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(247, 239, 216, 0.18);
      background: rgba(247, 239, 216, 0.08);
      font-weight: 700;
    }
    .pokerCountdown {
      font-size: 34px;
      color: var(--poker-accent);
      letter-spacing: 0.04em;
    }
    .pokerMessage {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--poker-line);
      background: rgba(255, 255, 255, 0.03);
    }
    .pokerMessage.is-agent {
      border-color: rgba(210, 162, 76, 0.28);
      background: rgba(210, 162, 76, 0.08);
    }
    .pokerRailEntry {
      background: rgba(255, 255, 255, 0.02);
    }
    .pokerActionCluster {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pokerActionCluster[data-admin-action-group="destructive"] {
      border-top-color: rgba(201, 135, 120, 0.28);
    }
    .pokerChipRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .pokerChip {
      border-radius: 999px;
      border: 1px solid rgba(247, 239, 216, 0.18);
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
    }
    .pokerChatLog {
      display: grid;
      gap: 10px;
    }
    .pokerChatLine {
      display: grid;
      gap: 8px;
      border-radius: 14px;
      border: 1px solid var(--poker-line);
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 14px;
    }
    .pokerList {
      margin: 12px 0 0;
      padding-left: 18px;
      color: var(--poker-muted);
      line-height: 1.5;
    }
    .pokerMuted {
      color: var(--poker-muted);
    }
    .pokerEmpty {
      color: var(--poker-muted);
      padding: 8px 0;
    }
    .pokerGrid[data-poker-view="play-table"] {
      gap: 18px;
    }
    .pokerGrid[data-poker-view="play-lobby"] > [data-poker-section="quick-seat"],
    .pokerGrid[data-poker-view="play-lobby"] > [data-poker-section="live-tables"],
    .pokerGrid[data-poker-view="play-schedule"] > [data-poker-section="schedule-day"],
    .pokerGrid[data-poker-view="play-schedule"] > [data-poker-section="schedule-snapshot"] {
      border-color: rgba(228, 189, 121, 0.16);
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"],
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] {
      border-color: rgba(228, 189, 121, 0.32);
      background: linear-gradient(180deg, rgba(228, 189, 121, 0.12) 0%, rgba(17, 24, 29, 0.98) 100%);
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] {
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(228, 189, 121, 0.12) inset;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerForm,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="your-seat"] .pokerForm {
      margin-top: 16px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerForm {
      gap: 10px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="submit-action"] .pokerButton {
      width: 100%;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSplit {
      align-items: flex-start;
      gap: 16px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSplit > * {
      flex: 1 1 140px;
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="table-summary"] .pokerSummary,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="your-seat"] .pokerSummary,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="current-hand"] .pokerSummary {
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    }
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="seat-thread"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="study-preview"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="table-review"] .pokerStack,
    .pokerGrid[data-poker-view="play-table"] > [data-poker-section="operator-review"] .pokerStack {
      gap: 12px;
    }
    .pokerGrid[data-poker-view="play-hand-review"] {
      gap: 18px;
    }
    .pokerGrid[data-poker-view="play-hand-review"] > [data-poker-section="review-summary-shell"] .pokerLinks {
      margin-top: 18px;
    }
    .pokerGrid[data-poker-view="play-hand-review"] > :is(
      [data-poker-section="review-result-summary"],
      [data-poker-section="review-action-line"],
      [data-poker-section="review-board-pot"]
    ) {
      border-color: rgba(228, 189, 121, 0.24);
    }
    .pokerGrid[data-poker-view="play-hand-review"] > :is(
      [data-poker-section="review-human-note"],
      [data-poker-section="review-agent-note"],
      [data-poker-section="review-lesson-tags"],
      [data-poker-section="review-notebook"],
      [data-poker-section="review-opponent-notes"]
    ) .pokerStack {
      gap: 12px;
    }
    .pokerGrid[data-poker-view="play-native-season"] {
      gap: 18px;
    }
    .pokerGrid[data-poker-view="play-native-season"] > [data-poker-section="season-leaderboard"] {
      border-color: rgba(228, 189, 121, 0.28);
      background: linear-gradient(180deg, rgba(228, 189, 121, 0.1) 0%, rgba(17, 24, 29, 0.96) 100%);
    }
    .pokerGrid[data-poker-view="play-rail-lobby"],
    .pokerGrid[data-poker-view="play-rail-series"] {
      gap: 18px;
    }
    .pokerGrid:is([data-poker-view="play-rail-lobby"], [data-poker-view="play-rail-series"]) .pokerCard {
      background: linear-gradient(180deg, rgba(24, 33, 38, 0.76) 0%, rgba(17, 24, 29, 0.9) 100%);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
    }
