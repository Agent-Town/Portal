<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Town</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="stylesheet" href="/styles.css?v=20260319a" />
</head>
<body>
  <main class="startWrap">
    <section class="startCard" data-testid="start-card">
      <img class="startLogo" src="/logo.jpg" alt="Agent Town logo" />

      <div class="startHero">
        <iframe
          id="startVideoFrame"
          class="startVideo"
          src="https://www.youtube.com/embed/ZW7tUUZqhdY?rel=0"
          title="Agent Town intro video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <img
          id="startHeroPoster"
          class="startVideo is-hidden"
          src="/agenttown.jpeg"
          alt="Agent Town intro"
        />

        <section class="startAuthBox is-hidden" id="privyAuthBox" data-testid="privy-auth-box" aria-live="polite">
          <h2 class="startAuthTitle">Sign in with Privy</h2>
          <p class="small startAuthHelp" id="privyAuthHelp">Enter your email to receive a one-time code.</p>

          <form id="privyEmailForm" class="startAuthForm">
            <label class="small" for="privyEmailInput">Email</label>
            <input id="privyEmailInput" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required />
            <button class="btn primary" type="submit">Send code</button>
          </form>

          <form id="privyCodeForm" class="startAuthForm is-hidden">
            <label class="small" for="privyCodeInput">Code</label>
            <input id="privyCodeInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required />
            <button class="btn primary" type="submit">Verify code</button>
          </form>

          <div class="startAuthActions">
            <button class="btn" id="privyAuthCancelBtn" type="button">Cancel</button>
          </div>
        </section>
      </div>

      <section class="startPreferenceBox" id="startPreferenceBox" data-testid="start-preference-chooser">
        <div class="small startPreferenceTitle" id="startPreferenceTitle">Choose your path</div>
        <p class="small startPreferenceHelp" id="startPreferenceHelp">
          Pick the setup that best matches your language and network environment.
        </p>
        <div class="startPreferenceOptions">
          <button class="startPreferenceOption" id="startPresetGlobalBtn" data-testid="start-preset-global" type="button" data-preset-id="global-default">
            <span class="startPreferenceOptionLabel" id="startPresetGlobalLabel">English / Global</span>
            <span class="small startPreferenceOptionHelp" id="startPresetGlobalHelp">Current global path with the default recommendations.</span>
          </button>
          <button class="startPreferenceOption" id="startPresetCnBtn" data-testid="start-preset-cn" type="button" data-preset-id="cn-mainland">
            <span class="startPreferenceOptionLabel" id="startPresetCnLabel">简体中文 / Mainland-friendly</span>
            <span class="small startPreferenceOptionHelp" id="startPresetCnHelp">Chinese-first copy with mainland-safe recommendations and media.</span>
          </button>
        </div>
        <div class="small startPreferenceCurrent" id="startPreferenceCurrent"></div>
      </section>

      <h1 class="startTitle">Welcome to the Wild West!</h1>
      <div class="startEntryActions">
        <button class="btn primary startEnterBtn" id="enterBtn" type="button" disabled>Enter</button>
      </div>
      <p class="small startStatus" id="startStatus" aria-live="polite"></p>
    </section>
  </main>
  <p class="startWarning" aria-label="AI warning">WARNING! CONTAINS AND PRODUCES AI SLOP</p>

  <script src="/experience_profiles.js?v=20260309a"></script>
  <script src="/experience_runtime.js?v=20260309a"></script>
  <script src="/i18n.js?v=20260309a"></script>
  <script src="/privy_bridge.js?v=20260218a"></script>
  <script src="/start.js?v=20260309a"></script>
</body>
</html>
