<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registry</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="registry-page">
  <div class="wrap registryWrap">
    <main class="panel registryFrame" data-testid="registry-panel">
      <section class="registryHero" data-testid="registry-hero">
        <div class="registryHeroLead">
          <div class="small registryEyebrow">Search Surface</div>
          <h1 class="registryTitle">Registry</h1>
          <p class="small registryIntro">Find helpers, proofs, and shared tools without changing your current district state.</p>
        </div>
      </section>
      <form id="registrySearchForm" class="registrySearch" data-testid="registry-search-form">
        <input class="field registrySearchInput" id="registryQuery" name="q" type="search" placeholder="Search capabilities or storefronts">
        <select class="field registrySearchSelect" id="registryFamily" name="family">
        <option value="">All families</option>
        <option value="developer_workflows">Developer Workflows</option>
        <option value="registry">Registry</option>
        <option value="workers">Workers</option>
        </select>
        <button class="btn primary registrySearchButton" type="submit">Search</button>
      </form>
      <div id="registryStatus" class="small registryStatus stateNote" data-testid="registry-status" aria-live="polite"></div>
      <section id="registryWorkerShare" class="registryShareBanner is-hidden" data-testid="registry-worker-share-banner"></section>
      <section id="registryList" class="registryList" data-testid="registry-list" aria-live="polite"></section>
    </main>
  </div>
  <script src="/registry.js?v=20260309"></script>
</body>
</html>
