<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Town</title>
  <meta name="description" content="Co-op onboarding for Agent Town" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/logo.jpg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="town-hub-page">
  <div class="wrap townWrap">
    <section class="townOverview" id="townScenePanel">
      <div class="townScene" role="navigation" aria-label="Town menu map" id="districtMap">
        <button class="townDistrictHotspot townDistrict-fountain" type="button" data-district="leaderboard" aria-label="Open Town Board">
          <span class="townDistrictLabel">Town Board</span>
        </button>
        <button class="townDistrictHotspot townDistrict-pony" type="button" data-district="pony" aria-label="Open Pony Express"></button>
        <button class="townDistrictHotspot townDistrict-townhall" type="button" data-district="townhall" aria-label="Open Town Hall"></button>
        <button class="townDistrictHotspot townDistrict-saloon" type="button" data-district="saloon" aria-label="Open Saloon"></button>
        <button class="townDistrictHotspot townDistrict-wagons is-active" type="button" data-district="house" aria-label="Open Plan Wagons">
          <span class="townDistrictLabel">Plan Wagons</span>
        </button>
      </div>
      <div class="small" id="townSceneStatus">Plan Wagons selected: unlock and enter your house flow.</div>
    </section>

    <div id="districtModalBackdrop" class="districtBackdrop is-hidden" aria-hidden="true">
      <div class="districtModal" role="dialog" aria-labelledby="districtModalTitle" aria-modal="true">
        <header class="districtModalHeader">
          <h2 id="districtModalTitle">Plan Wagons</h2>
          <button class="btn districtModalClose" id="districtModalClose" type="button" aria-label="Close building">Close</button>
        </header>
        <div id="districtModalBody" class="districtModalBody is-loading">Loading district...</div>
      </div>
    </div>

  </div>

  <script src="/wallet_client.js?v=20260217h"></script>
  <script src="/privy_bridge.js?v=20260218a"></script>
  <script src="/app.js?v=20260218h"></script>
</body>
</html>
