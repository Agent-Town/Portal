<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experience Trainer — Agent Town</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <a class="logoLink" href="/" aria-label="Agent Town home">
          <img class="logoImg" src="/logo.jpg" alt="" />
        </a>
        <strong>Experience Trainer</strong>
      </div>
      <div class="actions">
        <a class="btn" href="/app">Back</a>
      </div>
    </div>

    <section class="panel" data-testid="trainer-root">
      <h2 style="margin-top:0;">Quest: Portal Onboarding</h2>
      <p class="muted" id="trainerStatusLine">Trainer ready.</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
        <button class="btn small" id="trainerRunOnceBtn" type="button">Run 1</button>
        <button class="btn small" id="trainerRun3Btn" type="button">Run 3</button>
        <button class="btn small" id="trainerRun10Btn" type="button">Run 10</button>
        <label class="small" for="trainerCoachingMode">Coaching</label>
        <select id="trainerCoachingMode" class="input" style="max-width:120px;">
          <option value="approve">Off</option>
          <option value="reject">Reject tools</option>
          <option value="manual">Manual</option>
        </select>
        <label class="small" style="display:flex; align-items:center; gap:6px;">
          <input id="trainerAdvancedToggle" type="checkbox" />
          Advanced
        </label>
      </div>

      <div class="stack">
        <div class="panel">
          <h3 style="margin-top:0;">Attempts</h3>
          <div id="trainerAttempts" data-testid="trainer-attempts"></div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">Timeline</h3>
          <div id="trainerTimeline" data-testid="trainer-timeline"></div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">Inspector</h3>
          <pre id="trainerInspector" data-testid="trainer-inspector"></pre>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">Compare</h3>
          <div id="trainerCompare" data-testid="trainer-compare"></div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">Loadouts</h3>
          <div id="trainerLoadouts" data-testid="trainer-loadouts"></div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0;">Personal Backup</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <button class="btn small" id="trainerBackupDownloadBtn" type="button" data-testid="trainer-backup-download">Download backup</button>
            <input id="trainerBackupUploadInput" data-testid="trainer-backup-upload" type="file" accept="application/json,.json" />
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/openclaw-lite/gateway.js"></script>
  <script src="/openclaw-lite/runtime-bridge.js?v=20260213"></script>
  <script src="/agent_panel.js"></script>
  <script src="/trainer.js"></script>
</body>
</html>
