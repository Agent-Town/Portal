<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZHC1 — Iteration Feed</title>
<link rel="stylesheet" href="/feed.css">
</head>
<body>
<div class="feed-modal" data-testid="private-feed">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="problem-title" id="problem-title">Optimize landing page conversion rate</div>
      <div class="iteration-label" id="iteration-label">Round 1 · 3 experiments</div>
    </div>
    <div class="top-bar-right">
      <button class="top-btn" title="Save">💾</button>
      <button class="top-btn" title="Story">📋</button>
      <button class="top-btn" title="Close" id="close-btn">✕</button>
    </div>
  </div>

  <!-- Score Trend -->
  <div class="score-trend">
    <div class="sparkline" id="sparkline"></div>
    <div>
      <div class="trend-score" id="trend-score">0.91</div>
      <div class="trend-label">composite score</div>
    </div>
    <div class="trend-delta" id="trend-delta">↑ 0.08 from last</div>
  </div>

  <!-- Tabs -->
  <div class="feed-tabs">
    <button class="feed-tab active" data-tab="experiments">My Experiments</button>
    <button class="feed-tab" data-tab="discovery">Discovery 🔒</button>
  </div>

  <!-- Card Area -->
  <div class="card-area" id="card-area"></div>

  <!-- Feedback Bar -->
  <div class="feedback-bar">
    <input class="feedback-input" placeholder="Tell the agent what to improve…" />
    <button class="mic-btn" id="mic-btn">🎙</button>
  </div>
</div>

<script src="/feed.js"></script>
</body>
</html>
