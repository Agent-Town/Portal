<div class="panel">
    <h2>Connect Brain</h2>
    <p class="small">Configure the Language Model (LLM) that powers your Agent. This is the "brain" of your agent.</p>

    <div class="brain-config" style="margin-top: 20px;">
        <div class="kv dense">
            <label class="small-label">Provider</label>
            <select class="input" id="llmProviderSelect" data-testid="lite-llm-provider">
                <option value="openai">openai</option>
                <option value="ollama">ollama</option>
                <option value="openai-codex">openai-codex</option>
                <option value="anthropic">anthropic</option>
                <option value="openrouter">openrouter</option>
                <option value="litellm">litellm</option>
                <option value="amazon-bedrock">amazon-bedrock</option>
                <option value="vercel-ai-gateway">vercel-ai-gateway</option>
                <option value="moonshot">moonshot</option>
                <option value="kimi-coding">kimi-coding</option>
                <option value="minimax">minimax</option>
                <option value="opencode">opencode</option>
                <option value="zai">zai</option>
                <option value="glm">glm</option>
                <option value="synthetic">synthetic</option>
                <option value="qianfan">qianfan</option>
                <option value="qwen-portal">qwen-portal</option>
                <option value="qwen">qwen</option>
                <option value="together">together</option>
                <option value="cloudflare-ai-gateway">cloudflare-ai-gateway</option>
                <option value="xiaomi">xiaomi</option>
                <option value="venice">venice</option>
                <option value="huggingface">huggingface</option>
                <option value="vllm">vllm</option>
                <option value="nvidia">nvidia</option>
                <option value="google">google</option>
                <option value="groq">groq</option>
                <option value="test-local">test-local</option>
            </select>

            <label class="small-label">Model ID</label>
            <select class="input" id="llmModelIdInput" data-testid="lite-llm-model">
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-4o-mini">gpt-4o-mini</option>
            </select>

            <label class="small-label">Auth mode</label>
            <select class="input" id="llmAuthModeSelect" data-testid="lite-llm-auth">
                <option value="api-key">API Key</option>
                <option value="oauth-json">OpenAI OAuth Profile / Token</option>
            </select>

            <label class="small-label">OAuth profile JSON / token</label>
            <textarea class="input" id="llmOauthProfileInput" rows="3"
                placeholder="Paste OAuth profile JSON or raw access token (id_token callback URLs are not supported)."
                style="display: none;"></textarea>
            <div class="small" id="llmOauthProfileHint"></div>
            <div class="small" id="llmProviderWarning" style="color: var(--bad);"></div>
            <button class="btn small" id="llmOauthLaunchBtn" type="button" style="display:none; justify-self:start;"
                data-testid="lite-llm-oauth-launch">Start OAuth in new tab</button>
            <button class="btn small" id="llmOauthCompleteBtn" type="button" style="display:none; justify-self:start;"
                data-testid="lite-llm-oauth-complete">Complete OAuth</button>

            <label class="small-label">API Key</label>
            <input class="input" id="llmKeyInput" type="password" placeholder="sk-..." data-testid="lite-llm-api-key" />
        </div>

        <details style="margin-top: 14px; border: 1px solid #444; border-radius: 4px; padding: 10px;">
            <summary class="small" style="cursor: pointer;">Advanced Settings</summary>
            <div class="kv dense" style="margin-top: 10px;">
                <label class="small-label">Base URL (Optional)</label>
                <input class="input" id="llmBaseUrlInput" placeholder="https://api.openai.com/v1" />

                <label class="small-label">Thinking Level</label>
                <select class="input" id="llmThinkingInput">
                    <option value="">Default</option>
                    <option value="low">Low</option>
                    <option value="high">High</option>
                    <option value="xhigh">XHigh</option>
                </select>

                <label class="small" style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                    <input id="llmUseProxyInput" type="checkbox" checked />
                    Use Proxy (Recommended)
                </label>
            </div>
        </details>

        <input id="llmModelRefInput" type="hidden" />
        <input id="llmApiInput" type="hidden" />

        <div class="kv" style="margin-top: 20px;">
            <button class="btn primary" id="llmSaveBtn" data-testid="lite-llm-save">Connect Brain</button>
            <button class="btn" id="llmClearBtn" data-testid="lite-llm-clear">Clear Brain</button>
            <div class="small status-text hide" id="llmLine" data-testid="lite-llm-status"></div>
        </div>
    </div>

    <div class="divider" style="margin: 24px 0;"></div>

    <div class="kv right" style="margin-top: 20px;">
        <button class="btn primary" id="brainContinueBtn" disabled>Continue</button>
    </div>
    <p class="small status-text right" id="brainStatus" style="margin-top: 10px;"></p>
</div>
